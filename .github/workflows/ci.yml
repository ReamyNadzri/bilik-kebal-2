name: CI

on:
  push:
    branches: [main]
  pull_request:

# No deployment, no secrets, no live provider calls, and nothing that could
# enable public uploads or live payment. See context/ai-workflow-rules.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          # The build must succeed with providers disabled and no secrets.
          PAYMENT_MODE: disabled
          PUBLIC_UPLOADS_ENABLED: "false"
