<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>VAULTIX revolver reload: pixel preview</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #191714; color: #f3e6c8; padding: 24px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
  .stages { display: flex; gap: 24px; flex-wrap: wrap; }
  .stage { width: 360px; height: 280px; display: grid; place-items: center; }
  .stage.dark { background: #2a2118; }
  .stage.paper { background: #f3e6c8; }
  .stage.small { width: 120px; height: 90px; }
  canvas { image-rendering: pixelated; transform: rotate(-12deg); }
  .big canvas { width: 288px; height: 192px; }
  .small canvas { width: 72px; height: 48px; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; }
  .strip figure { margin: 0; background: #2a2118; padding: 4px; text-align: center; }
  .strip canvas { width: 144px; height: 96px; transform: none; }
  .strip figcaption { font-size: 11px; color: #c2ab82; }
  label { display: inline-flex; gap: 6px; align-items: center; margin: 12px 16px 0 0; font-size: 13px; }
</style>
<h1>Revolver reload: 72 × 48 native pixels, shown ×4 and ×1 (real spinner size)</h1>
<div class="stages">
  <div class="stage dark big"><canvas id="a" width="72" height="48"></canvas></div>
  <div class="stage paper big"><canvas id="b" width="72" height="48"></canvas></div>
  <div class="stage dark small"><canvas id="c" width="72" height="48"></canvas></div>
  <div class="stage paper small"><canvas id="d" width="72" height="48"></canvas></div>
</div>
<label><input type="checkbox" id="pause" /> Pause</label>
<label>Speed <input type="range" id="speed" min="0.25" max="2" step="0.25" value="1" /></label>
<div class="strip" id="strip"></div>
<script>
// VAULTIX revolver reload: original pixel art, drawn from code.
// 72 x 48 native pixels, 8-colour palette, every part outlined 1 px.

const W = 72;
const H = 48;
const C = {
  O: "#2a2118", // outline
  SD: "#5e4f37", // steel dark
  SM: "#9c8558", // steel mid
  SL: "#d3bc92", // steel light
  WD: "#3a2412", // wood dark
  WM: "#7a4a26", // wood mid
  B: "#b79763", // brass
  R: "#9e2b25", // red accent
};

const grid = () => Array.from({ length: H }, () => Array(W).fill(null));

/** A part: painted on its own layer, outlined, then laid on top of what is below. */
function part(target, paint) {
  const g = grid();
  const set = (x, y, c) => {
    if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = c;
  };
  paint(set);
  const out = grid();
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      if (g[y][x]) continue;
      const near = [
        [1, 0],
        [-1, 0],
        [0, 1],
        [0, -1],
      ].some(([dx, dy]) => g[y + dy]?.[x + dx] && g[y + dy][x + dx] !== "O");
      if (near) out[y][x] = "O";
    }
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      const c = g[y][x] ?? out[y][x];
      if (c) target[y][x] = c;
    }
}

const rect = (set, x0, y0, x1, y1, c) => {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, c);
};

// ── Fixed gun ────────────────────────────────────────────────────────────────

function grip(set) {
  for (let y = 23; y <= 42; y++) {
    const t = y - 23;
    const xl = 18 - Math.floor(t * 0.55);
    const xr = 28 - Math.floor(t * 0.4);
    const round = y === 42 ? 1 : 0;
    for (let x = xl + round; x <= xr - round; x++) {
      let c = "WM";
      if (y >= 40) c = "SD"; // steel butt cap
      else if (x === xl || x >= xr - 1 || y === 39) c = "WD"; // panel border
      else if (x === xl + 1) c = "B"; // warm highlight along the front edge
      set(x, y, c);
    }
  }
  // checkering
  for (let i = 0; i < 3; i++) for (let k = 0; k < 5; k++) set(16 - i * 2 + k, 28 + i * 3 + k, "WD");
  set(21, 26, "SL"); // grip screw
}

function frame(set, windowOpen) {
  rect(set, 18, 11, 35, 25, "SM");
  rect(set, 18, 11, 35, 11, "SL"); // top strap highlight
  rect(set, 18, 24, 35, 25, "SD");
  rect(set, 18, 12, 19, 23, "SD"); // recoil shield
  // cylinder window: dark recess when the cylinder is out
  if (windowOpen) {
    rect(set, 21, 13, 34, 22, "SD");
    rect(set, 21, 13, 34, 13, "O"); // shadow under the top strap
    rect(set, 21, 13, 21, 22, "O");
  }
}

function hammer(set) {
  const rows = [
    [10, 12, 5],
    [10, 14, 6],
    [12, 16, 7],
    [13, 17, 8],
    [15, 18, 9],
    [16, 19, 10],
  ];
  for (const [a, b, y] of rows)
    for (let x = a; x <= b; x++) set(x, y, y <= 6 ? "SM" : "SD");
  set(11, 5, "SL");
}

function triggerGuard(set) {
  for (let x = 25; x <= 32; x++) set(x, 31, "SD");
  for (let y = 26; y <= 30; y++) set(24, y, "SD");
  set(33, 26, "SD");
  set(33, 27, "SD");
  set(32, 28, "SD");
  set(32, 29, "SD");
  set(32, 30, "SD");
}

function trigger(set) {
  rect(set, 28, 26, 29, 27, "SM");
  set(27, 28, "SM");
  set(27, 29, "SM");
}

function barrel(set) {
  rect(set, 35, 13, 64, 17, "SM");
  rect(set, 35, 13, 64, 13, "SL");
  rect(set, 35, 16, 64, 17, "SD");
  rect(set, 64, 13, 64, 17, "SD"); // muzzle face
  rect(set, 35, 18, 54, 19, "SD"); // ejector-rod housing
  set(60, 11, "R"); // front sight
  set(61, 11, "R");
  set(60, 12, "SD");
  set(61, 12, "SD");
}

// ── Moving parts ─────────────────────────────────────────────────────────────

const CYL = { x0: 22, x1: 34, y0: 13, y1: 22 };

function crane(set, drop) {
  if (drop <= 0) return;
  rect(set, 33, 22, 34, 22 + drop, "SD");
}

const shiftFor = (drop) => -Math.round((drop / MAX_DROP) * 2);

function cylinder(set, drop, turn, nudge) {
  const x0 = CYL.x0 + nudge + shiftFor(drop);
  const x1 = CYL.x1 + nudge + shiftFor(drop);
  const y0 = CYL.y0 + drop;
  const y1 = CYL.y1 + drop;
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const corner = (y === y0 || y === y1) && (x === x0 || x === x1);
      if (corner) continue;
      let c = "SM";
      if (y === y0) c = "SL";
      if (y >= y1 - 1) c = "SD";
      set(x, y, c);
    }
  // two flutes that roll down one step per chamber turned
  const p = turn % 3;
  for (const f of [1 + p, 4 + p]) {
    if (y0 + f + 1 >= y1 - 1) continue;
    for (let x = x0 + 2; x <= x1 - 2; x++) {
      set(x, y0 + f, "SD");
      set(x, y0 + f + 1, "SL"); // bevel under each flute
    }
  }
  rect(set, x1, y0 + 1, x1, y1 - 1, "SD"); // front face
}

/** Rear face, seen edge-on as a narrow oval once the cylinder tilts out. */
function rearFace(set, drop, maxDrop, turn, loaded) {
  const w = Math.round((drop / maxDrop) * 6);
  if (w <= 0) return;
  const y0 = CYL.y0 + drop;
  const y1 = CYL.y1 + drop;
  const xr = CYL.x0 - 1 + shiftFor(drop);
  const xl = xr - w + 1;
  for (let y = y0; y <= y1; y++) {
    const inset = y === y0 || y === y1 ? 1 : 0;
    for (let x = xl + inset; x <= xr; x++) set(x, y, x === xl + inset ? "SL" : "SM");
  }
  if (w < 3) return;
  // three visible chambers: top (loading spot), middle, bottom
  const slots = [
    [y0 + 1, turn],
    [y0 + 4, turn - 1],
    [y0 + 7, turn - 2],
  ];
  const hx = xl + 2;
  for (const [y, chamber] of slots) {
    const full = loaded.has(((chamber % 6) + 6) % 6);
    set(hx, y, full ? "SL" : "O");
    set(hx + 1, y, full ? "B" : "O");
    set(hx + 2, y, full ? "B" : "O");
    set(hx, y + 1, full ? "B" : "O");
    set(hx + 1, y + 1, full ? "B" : "O");
    set(hx + 2, y + 1, full ? "WD" : "O");
  }
}

function bullet(set, x, y) {
  rect(set, x + 1, y, x + 5, y + 1, "B"); // brass case
  rect(set, x + 1, y, x + 5, y, "SL"); // highlight
  rect(set, x, y, x, y + 1, "WD"); // rim
  rect(set, x + 6, y, x + 7, y + 1, "SM"); // lead
  set(x + 8, y + 1, "SM");
  set(x + 8, y, "SL");
}

// ── Frames ───────────────────────────────────────────────────────────────────

const MAX_DROP = 9;

function frames() {
  const list = [];
  const loaded = new Set();
  let turn = 0;
  const push = (ms, s) => list.push({ ms, turn, loaded: new Set(loaded), drop: 0, nudge: 0, ...s });

  push(160, {});
  push(140, {});
  push(60, { drop: 3 });
  push(60, { drop: 6 });
  push(90, { drop: MAX_DROP });
  for (let n = 0; n < 5; n++) {
    const hole = CYL.x0 - 1 + shiftFor(MAX_DROP) - 6 + 2; // top chamber on the rear face
    const y = CYL.y0 + MAX_DROP + 1;
    push(60, { drop: MAX_DROP, bullet: [hole - 14, y] });
    push(50, { drop: MAX_DROP, bullet: [hole - 10, y] });
    push(50, { drop: MAX_DROP, bullet: [hole - 5, y] });
    loaded.add(((turn % 6) + 6) % 6);
    push(n === 4 ? 100 : 70, { drop: MAX_DROP, nudge: 1 });
    if (n < 4) {
      turn += 1;
      push(80, { drop: MAX_DROP });
    }
  }
  push(60, { drop: 5 });
  push(70, { drop: 0, nudge: -1 });
  push(90, { drop: 0 });
  push(160, {});
  return list;
}

function draw(f) {
  const g = grid();
  part(g, grip);
  part(g, triggerGuard);
  part(g, trigger);
  part(g, (set) => frame(set, f.drop > 0));
  part(g, hammer);
  part(g, barrel);
  if (f.bullet) part(g, (set) => bullet(set, f.bullet[0], f.bullet[1]));
  part(g, (set) => crane(set, f.drop));
  part(g, (set) => cylinder(set, f.drop, f.turn, f.nudge));
  part(g, (set) => rearFace(set, f.drop, MAX_DROP, f.turn, f.loaded));
  return g;
}

function paint(canvas, g) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      const c = g[y][x];
      if (!c) continue;
      ctx.fillStyle = C[c];
      ctx.fillRect(x, y, 1, 1);
    }
}

// ── Playback ─────────────────────────────────────────────────────────────────

const all = frames();
const drawn = all.map(draw);
const canvases = ["a", "b", "c", "d"].map((id) => document.getElementById(id));
const pause = document.getElementById("pause");
const speed = document.getElementById("speed");

let i = 0;
function tick() {
  if (!pause.checked) {
    canvases.forEach((cv) => paint(cv, drawn[i]));
    i = (i + 1) % all.length;
  }
  setTimeout(tick, all[i].ms / Number(speed.value));
}
tick();

const strip = document.getElementById("strip");
all.forEach((f, n) => {
  const fig = document.createElement("figure");
  const cv = document.createElement("canvas");
  cv.width = W;
  cv.height = H;
  paint(cv, drawn[n]);
  const cap = document.createElement("figcaption");
  cap.textContent = `F${n + 1} · ${f.ms} ms`;
  fig.append(cv, cap);
  strip.append(fig);
});

</script>
</html>
